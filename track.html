<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beast Tracker — CRUMBLY</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    :root {
      --accent: #E9723D;
      --accent-glow: rgba(233, 114, 61, 0.4);
      --bg-dark: #12100E;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --muted: #a0a0a0;
    }
    
    * { box-sizing: border-box; }
    
    body { 
      background: radial-gradient(circle at 50% -20%, #2a1a12 0%, var(--bg-dark) 80%);
      margin: 0; padding: 0; 
      font-family: 'Outfit', sans-serif; 
      color: var(--text);
      min-height: 100vh;
      transition: background 0.5s ease, color 0.5s ease;
    }

    /* Light Theme Overrides */
    body.light-theme {
      --bg-dark: #f9f6f0;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(0, 0, 0, 0.08);
      --text: #2c2520;
      --muted: #777777;
      background: radial-gradient(circle at 50% -20%, #ffffff 0%, var(--bg-dark) 80%);
    }
    body.light-theme .track-card { box-shadow: 0 20px 50px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,1); }
    body.light-theme .track-input-group { background: rgba(0,0,0,0.04); }
    body.light-theme .track-input { color: var(--text); }
    body.light-theme .track-input::placeholder { color: #888; }
    body.light-theme .product-section { background: rgba(255,255,255,0.6); }
    body.light-theme .p-tag { background: rgba(0,0,0,0.05); color: #333; }
    body.light-theme .summary-item { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.04); }
    body.light-theme .summary-item strong { color: var(--text); }
    body.light-theme .step-circle { background: #e0e0e0; border-color: #fff; color: #666; }
    body.light-theme .step.active .step-circle { color: white; }
    body.light-theme .step-label { color: #888; }
    body.light-theme .timeline-activity { color: var(--text); }
    body.light-theme .timeline-item::before { background: #e0e0e0; border-color: rgba(0,0,0,0.1); }
    body.light-theme .timeline-item.latest::before { background: var(--accent); border-color: var(--accent); }
    body.light-theme #map-container { filter: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    
    /* Theme Toggle Button */
    .theme-toggle {
      position: absolute; top: 20px; right: 20px; background: var(--glass-bg); border: 1px solid var(--glass-border);
      color: var(--text); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-family: 'Outfit'; font-weight: 600;
      transition: all 0.3s; backdrop-filter: blur(10px);
    }
    .theme-toggle:hover { transform: scale(1.05); }

    .track-page { 
      display: flex; flex-direction: column; align-items: center; 
      padding: 60px 20px; max-width: 800px; margin: 0 auto;
    }
    
    .logo { 
      font-size: 36px; color: var(--accent); margin-bottom: 30px; 
      font-family: 'Fredoka', sans-serif; font-weight: 700; 
      text-decoration: none; text-shadow: 0 0 20px var(--accent-glow);
      letter-spacing: -1px;
    }
    
    /* Glassmorphism Container */
    .track-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px; width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 { font-family: 'Fredoka', sans-serif; font-size: 28px; margin: 0 0 10px 0; font-weight: 600; }
    p.subtitle { color: var(--muted); font-size: 15px; margin: 0 0 30px 0; }

    /* Search Input */
    .track-input-group { 
      display: flex; gap: 12px; margin-bottom: 35px; 
      background: rgba(0,0,0,0.3); border-radius: 16px; padding: 6px;
      border: 1px solid var(--glass-border);
    }
    .track-input { 
      flex: 1; padding: 14px 20px; border-radius: 12px; 
      background: transparent; border: none; color: white;
      font-family: 'Outfit', sans-serif; font-size: 16px; outline: none; 
    }
    .track-input::placeholder { color: #666; }
    .track-btn { 
      padding: 14px 32px; border-radius: 12px; 
      background: var(--accent); color: white; font-weight: 700; 
      border: none; cursor: pointer; transition: all 0.3s;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .track-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 25px var(--accent-glow); }
    .track-btn:disabled { background: #333; box-shadow: none; color: #666; cursor: not-allowed; transform: none; }

    #track-result { display: none; animation: fadeUp 0.6s ease; }
    
    /* Product Section */
    .product-section {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 20px;
      margin-bottom: 30px;
      display: flex; align-items: center; gap: 20px;
    }
    .product-icon {
      width: 60px; height: 60px; border-radius: 12px;
      background: linear-gradient(135deg, #2a1a12, var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .product-details h4 { margin: 0 0 5px 0; font-size: 18px; font-weight: 600; }
    .product-details p { margin: 0; color: var(--muted); font-size: 14px; }
    .product-tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .p-tag { 
      background: rgba(255,255,255,0.05); padding: 4px 10px; 
      border-radius: 8px; font-size: 12px; font-weight: 600; color: #ddd; 
    }
    
    /* Summary Grid */
    .summary-grid { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
      margin-bottom: 35px; 
    }
    .summary-item { 
      background: rgba(255,255,255,0.02); padding: 16px; 
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);
    }
    .summary-item span { display: block; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .summary-item strong { color: white; font-size: 16px; font-weight: 600; }

    /* Progress Bar */
    .progress-wrapper { position: relative; display: flex; justify-content: space-between; margin: 50px 0 40px; }
    .progress-line { position: absolute; top: 16px; left: 0; right: 0; height: 4px; background: rgba(255,255,255,0.1); z-index: 1; border-radius: 2px; }
    .progress-line-fill { position: absolute; top: 16px; left: 0; height: 4px; background: var(--accent); z-index: 2; transition: width 1s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 2px; box-shadow: 0 0 10px var(--accent-glow); }
    
    .step { position: relative; z-index: 3; text-align: center; width: 70px; }
    .step-circle { 
      width: 36px; height: 36px; border-radius: 50%; background: #222; 
      color: #666; display: flex; align-items: center; justify-content: center; 
      margin: 0 auto 10px; font-weight: bold; font-size: 14px; 
      border: 4px solid var(--bg-dark); transition: all 0.5s ease; 
    }
    .step.active .step-circle { background: var(--accent); color: white; box-shadow: 0 0 20px var(--accent-glow); border-color: rgba(233,114,61,0.2); }
    .step.completed .step-circle { background: var(--accent); color: white; }
    .step-label { font-size: 12px; font-weight: 600; color: #666; line-height: 1.2; transition: color 0.3s; }
    .step.active .step-label, .step.completed .step-label { color: white; }

    /* Map */
    #map-container { 
      height: 280px; border-radius: 16px; overflow: hidden; 
      border: 1px solid var(--glass-border); margin-bottom: 35px; 
      display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      filter: invert(90%) hue-rotate(180deg) brightness(85%) contrast(110%);
    }

    h3 { font-family: 'Fredoka', sans-serif; font-size: 20px; margin-bottom: 20px; font-weight: 500; }
    
    /* Timeline */
    .timeline { position: relative; padding-left: 28px; border-left: 2px solid rgba(255,255,255,0.1); margin-left: 10px; }
    .timeline-item { position: relative; margin-bottom: 28px; animation: fadeUp 0.5s ease backwards; }
    .timeline-item:nth-child(2) { animation-delay: 0.1s; }
    .timeline-item:nth-child(3) { animation-delay: 0.2s; }
    .timeline-item:nth-child(4) { animation-delay: 0.3s; }

    .timeline-item::before { 
      content: ''; position: absolute; left: -35px; top: 4px; 
      width: 12px; height: 12px; border-radius: 50%; background: #222; 
      border: 2px solid rgba(255,255,255,0.2); 
    }
    .timeline-item.latest::before { 
      background: var(--accent); border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow); 
    }
    
    .timeline-date { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
    .timeline-activity { font-size: 16px; font-weight: 600; color: white; margin-bottom: 4px; }
    .timeline-location { font-size: 13px; color: var(--muted); }
    
    .error-msg { 
      background: rgba(217, 48, 37, 0.1); color: #ff6b6b; border: 1px solid rgba(217, 48, 37, 0.2);
      padding: 15px; border-radius: 12px; font-weight: 500; margin-bottom: 20px; 
      display: none; text-align: center; 
    }

    /* Custom Leaflet overrides for dark mode feel */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #222; color: white; }
  </style>
</head>
<body>

  <button class="theme-toggle" id="theme-btn">☀️ Light Mode</button>

  <div class="track-page">
    <a href="index.html" class="logo">CRUMBLY</a>
    
    <div class="track-card">
      <h2>Beast Mode Tracker</h2>
      <p class="subtitle">Enter your AWB tracking ID for deep insights, live coordinates, and product details.</p>
      
      <form id="track-form">
        <div class="track-input-group">
          <input type="text" id="awb-input" class="track-input" placeholder="e.g. 1319461125820" required autocomplete="off">
          <button type="submit" id="track-btn" class="track-btn">Track Order</button>
        </div>
      </form>
      
      <div id="error-msg" class="error-msg"></div>

      <div id="track-result">

        <!-- Products Section -->
        <div class="product-section" id="product-container" style="display: none;">
          <div class="product-icon">🍪</div>
          <div class="product-details">
            <h4>Order Contents</h4>
            <p id="product-name">Fetching purchased items...</p>
            <div class="product-tags" id="product-tags-container"></div>
          </div>
        </div>
        
        <!-- Summary Grid -->
        <div class="summary-grid">
          <div class="summary-item"><span>AWB Number</span><strong id="r-awb">-</strong></div>
          <div class="summary-item"><span>Courier</span><strong id="r-courier">-</strong></div>
          <div class="summary-item"><span>Consignee</span><strong id="r-name">-</strong></div>
          <div class="summary-item"><span>Route</span><strong id="r-route">-</strong></div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-wrapper">
          <div class="progress-line"></div>
          <div class="progress-line-fill" id="progress-fill" style="width: 0%;"></div>
          
          <div class="step" id="step-0"><div class="step-circle">1</div><div class="step-label">Processing</div></div>
          <div class="step" id="step-1"><div class="step-circle">2</div><div class="step-label">Picked Up</div></div>
          <div class="step" id="step-2"><div class="step-circle">3</div><div class="step-label">In Transit</div></div>
          <div class="step" id="step-3"><div class="step-circle">4</div><div class="step-label">Out for Delivery</div></div>
          <div class="step" id="step-4"><div class="step-circle">5</div><div class="step-label">Delivered</div></div>
        </div>

        <!-- Live Map -->
        <div id="map-container"></div>
        
        <h3>Logistics Timeline</h3>
        <!-- Timeline -->
        <div class="timeline" id="timeline-container"></div>
        
      </div>
    </div>
  </div>

  <script>
    const themeBtn = document.getElementById('theme-btn');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      if (document.body.classList.contains('light-theme')) {
        themeBtn.innerText = '🌙 Dark Mode';
      } else {
        themeBtn.innerText = '☀️ Light Mode';
      }
    });

    let map = null;
    let marker = null;

    document.getElementById('track-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const awb = document.getElementById('awb-input').value.trim();
      const btn = document.getElementById('track-btn');
      const errorDiv = document.getElementById('error-msg');
      const resultDiv = document.getElementById('track-result');
      const timelineContainer = document.getElementById('timeline-container');
      const mapContainer = document.getElementById('map-container');
      const prodContainer = document.getElementById('product-container');
      
      if (!awb) return;

      btn.disabled = true;
      btn.innerText = 'Locating...';
      errorDiv.style.display = 'none';
      resultDiv.style.display = 'none';
      prodContainer.style.display = 'none';
      timelineContainer.innerHTML = '';
      mapContainer.style.display = 'none';

      try {
        const response = await fetch(`/api/track?awb=${awb}`);
        const data = await response.json();
        
        btn.disabled = false;
        btn.innerText = 'Track Order';

        if (!response.ok || !data.tracking_data) {
          errorDiv.innerText = data.error || 'Tracking data not found. Check your AWB.';
          errorDiv.style.display = 'block';
          return;
        }

        const trackingData = data.tracking_data;
        const mainTrack = trackingData.shipment_track && trackingData.shipment_track[0];
        const activities = trackingData.shipment_track_activities || [];
        const products = data.products || [];

        if (!mainTrack) {
          errorDiv.innerText = 'Shipment is still processing in warehouse.';
          errorDiv.style.display = 'block';
          return;
        }

        // --- Populate Products ---
        if (products.length > 0) {
          prodContainer.style.display = 'flex';
          // Combine all product names
          const names = products.map(p => `${p.quantity}x ${p.name}`).join(' & ');
          document.getElementById('product-name').innerText = names;
          
          const tagsHtml = products.map(p => `
            <span class="p-tag">₹${p.price}</span>
            <span class="p-tag">SKU: ${p.sku}</span>
          `).join('');
          document.getElementById('product-tags-container').innerHTML = tagsHtml;
        }

        // --- Populate Summary ---
        document.getElementById('r-awb').innerText = mainTrack.awb_code || awb;
        document.getElementById('r-courier').innerText = mainTrack.courier_name || 'Assigned Courier';
        document.getElementById('r-name').innerText = mainTrack.consignee_name || 'Customer';
        document.getElementById('r-route').innerText = `${mainTrack.origin || 'WH'} ➔ ${mainTrack.destination || 'Home'}`;

        // --- Progress Status ---
        let stepIndex = 0;
        const sStatus = (mainTrack.current_status || '').toLowerCase();
        
        if (sStatus.includes('pick') || sStatus.includes('manifest')) stepIndex = 1; 
        if (sStatus.includes('transit') || sStatus.includes('shipped')) stepIndex = 2;
        if (sStatus.includes('out for delivery')) stepIndex = 3;
        if (sStatus.includes('delivered')) stepIndex = 4;

        for(let i=0; i<=4; i++) {
          document.getElementById('step-'+i).className = 'step';
        }
        for(let i=0; i<=stepIndex; i++) {
          document.getElementById('step-'+i).classList.add(i === stepIndex ? 'active' : 'completed');
        }
        
        // Slight delay for smooth progress animation
        setTimeout(() => {
          document.getElementById('progress-fill').style.width = ['0%', '25%', '50%', '75%', '100%'][stepIndex];
        }, 100);

        // --- Timeline & Coordinates ---
        let latestLat = null;
        let latestLng = null;
        
        if (activities.length > 0) {
          activities.forEach((act, idx) => {
            const el = document.createElement('div');
            el.className = 'timeline-item' + (idx === 0 ? ' latest' : '');
            
            const dateStr = act.date ? new Date(act.date).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '';
            
            el.innerHTML = `
              <div class="timeline-date">${dateStr}</div>
              <div class="timeline-activity">${act.activity || act.status}</div>
              ${act.location ? `<div class="timeline-location">📍 ${act.location}</div>` : ''}
            `;
            timelineContainer.appendChild(el);

            if (!latestLat && act.latitude && act.longitude && act.latitude !== "0" && act.latitude !== "") {
              latestLat = parseFloat(act.latitude);
              latestLng = parseFloat(act.longitude);
            }
          });
        } else {
          timelineContainer.innerHTML = '<div class="timeline-item latest"><div class="timeline-activity">Order processed. Waiting for carrier pickup.</div></div>';
        }

        // --- Map ---
        if (latestLat && latestLng) {
          mapContainer.style.display = 'block';
          
          if (!map) {
            map = L.map('map-container').setView([latestLat, latestLng], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
              attribution: '&copy; OSM contributors'
            }).addTo(map);
            marker = L.marker([latestLat, latestLng]).addTo(map);
          } else {
            map.setView([latestLat, latestLng], 12);
            marker.setLatLng([latestLat, latestLng]);
            map.invalidateSize();
          }
          
          marker.bindPopup(`<b>Latest Location:</b><br>${activities[0].location}`).openPopup();
          setTimeout(() => map.invalidateSize(), 300);
        }

        resultDiv.style.display = 'block';

      } catch (err) {
        btn.disabled = false;
        btn.innerText = 'Track Order';
        errorDiv.innerText = 'Network error. Please try again later.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
